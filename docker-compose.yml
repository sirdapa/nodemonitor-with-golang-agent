# Node Monitor (Dashboard + Agent)
# Usage:
#   docker compose up -d              # start everything
#   docker compose up -d monitor      # dashboard only
#   docker compose up -d agent        # agent only
#   docker compose logs -f monitor    # dashboard logs
#   docker compose down               # stop everything
#
# To add another agent, duplicate the "agent" service block and change
# its hostname. See the "agent-02" example below (commented out).

services:
  # --- Dashboard Server ---
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-monitor
    ports:
      - "${MONITOR_PORT:-3000}:3000"
    volumes:
      # Persist SQLite database to the host so data survives container removal.
      - monitor-data:/app/data
    environment:
      - PORT=3000
      - TOKEN=${TOKEN:-changeme}
      - DB_PATH=/app/data/monitor.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # --- Agent 01 ---
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: node-monitor-agent-01
    environment:
      - DASHBOARD_URL=http://monitor:3000
      - TOKEN=${TOKEN:-changeme}
      - HOSTNAME=agent-01
      - INTERVAL_SEC=10
      - TIMEOUT_SEC=5
    depends_on:
      monitor:
        condition: service_healthy
    restart: unless-stopped

  # --- Agent 02 (example of an additional agent) ---
  # Uncomment to run a second agent with a different hostname.
  # agent-02:
  #   build:
  #     context: ./agent
  #     dockerfile: Dockerfile
  #   container_name: node-monitor-agent-02
  #   environment:
  #     - DASHBOARD_URL=http://monitor:3000
  #     - TOKEN=${TOKEN:-changeme}
  #     - HOSTNAME=agent-02
  #     - INTERVAL_SEC=10
  #     - TIMEOUT_SEC=5
  #   depends_on:
  #     monitor:
  #       condition: service_healthy
  #   restart: unless-stopped

# --- Volumes ---
volumes:
  monitor-data:
    # Persisted SQLite database for the dashboard.
